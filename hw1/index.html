<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MyChatGPT</title>
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #0a0a0f;
    --surface: #13131a;
    --surface2: #1c1c28;
    --border: #2a2a3d;
    --accent: #7c6aff;
    --accent2: #ff6ab0;
    --text: #e8e8f0;
    --text-muted: #7070a0;
    --user-bubble: #1e1a3a;
    --assistant-bubble: #131320;
    --success: #4ade80;
    --warning: #fbbf24;
    --radius: 16px;
    --radius-sm: 8px;
    --sidebar-width: 320px;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: 'Syne', sans-serif;
    background: var(--bg);
    color: var(--text);
    height: 100vh;
    overflow: hidden;
    display: flex;
  }

  /* ── SIDEBAR ── */
  #sidebar {
    width: var(--sidebar-width);
    background: var(--surface);
    border-right: 1px solid var(--border);
    display: flex;
    flex-direction: column;
    padding: 24px 20px;
    gap: 20px;
    overflow-y: auto;
    transition: transform 0.3s ease;
    flex-shrink: 0;
  }

  .sidebar-header {
    display: flex;
    align-items: center;
    gap: 10px;
    padding-bottom: 16px;
    border-bottom: 1px solid var(--border);
  }

  .logo-icon {
    width: 36px; height: 36px;
    background: linear-gradient(135deg, var(--accent), var(--accent2));
    border-radius: 10px;
    display: flex; align-items: center; justify-content: center;
    font-size: 18px;
  }

  .logo-text {
    font-size: 18px; font-weight: 800;
    background: linear-gradient(135deg, var(--accent), var(--accent2));
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
  }

  .section-label {
    font-size: 11px;
    font-weight: 700;
    letter-spacing: 0.15em;
    text-transform: uppercase;
    color: var(--text-muted);
    margin-bottom: 6px;
  }

  .field-group { display: flex; flex-direction: column; gap: 6px; }

  label { font-size: 13px; color: var(--text-muted); font-weight: 600; }

  select, input[type="text"], input[type="number"], input[type="password"], textarea {
    background: var(--surface2);
    border: 1px solid var(--border);
    border-radius: var(--radius-sm);
    color: var(--text);
    font-family: 'Syne', sans-serif;
    font-size: 13px;
    padding: 10px 12px;
    width: 100%;
    outline: none;
    transition: border-color 0.2s, box-shadow 0.2s;
  }
  select:focus, input:focus, textarea:focus {
    border-color: var(--accent);
    box-shadow: 0 0 0 3px rgba(124,106,255,0.15);
  }

  textarea { resize: vertical; min-height: 90px; line-height: 1.5; }

  .api-key-wrapper { position: relative; }
  .api-key-wrapper input { padding-right: 40px; font-family: 'JetBrains Mono', monospace; font-size: 12px; }
  .toggle-key {
    position: absolute; right: 10px; top: 50%; transform: translateY(-50%);
    background: none; border: none; cursor: pointer; color: var(--text-muted);
    font-size: 16px; padding: 2px;
  }

  .range-row {
    display: flex; align-items: center; gap: 10px;
  }
  .range-row input[type="range"] {
    flex: 1; height: 4px; padding: 0; border: none; background: transparent;
    accent-color: var(--accent); cursor: pointer;
  }
  .range-val {
    font-family: 'JetBrains Mono', monospace;
    font-size: 12px; color: var(--accent);
    min-width: 36px; text-align: right;
  }

  .clear-btn {
    background: transparent;
    border: 1px solid var(--border);
    border-radius: var(--radius-sm);
    color: var(--text-muted);
    padding: 10px;
    cursor: pointer;
    font-family: 'Syne', sans-serif;
    font-size: 13px;
    font-weight: 600;
    text-align: center;
    transition: all 0.2s;
  }
  .clear-btn:hover {
    border-color: var(--accent2);
    color: var(--accent2);
    background: rgba(255,106,176,0.08);
  }

  .status-dot {
    width: 8px; height: 8px;
    border-radius: 50%;
    background: var(--text-muted);
    display: inline-block;
    margin-right: 6px;
    transition: background 0.3s;
  }
  .status-dot.ok { background: var(--success); box-shadow: 0 0 8px var(--success); }
  .status-dot.err { background: #f87171; box-shadow: 0 0 8px #f87171; }
  .status-text { font-size: 12px; color: var(--text-muted); }

  /* ── MAIN CHAT ── */
  #main {
    flex: 1;
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }

  #chat-header {
    padding: 18px 24px;
    border-bottom: 1px solid var(--border);
    display: flex;
    align-items: center;
    justify-content: space-between;
    background: var(--surface);
  }

  #chat-header h2 { font-size: 16px; font-weight: 700; color: var(--text); }
  #model-display {
    font-size: 12px;
    background: rgba(124,106,255,0.15);
    color: var(--accent);
    padding: 4px 10px;
    border-radius: 20px;
    font-family: 'JetBrains Mono', monospace;
    font-weight: 500;
  }

  #messages {
    flex: 1;
    overflow-y: auto;
    padding: 24px;
    display: flex;
    flex-direction: column;
    gap: 20px;
    scroll-behavior: smooth;
  }

  #messages::-webkit-scrollbar { width: 6px; }
  #messages::-webkit-scrollbar-track { background: transparent; }
  #messages::-webkit-scrollbar-thumb { background: var(--border); border-radius: 3px; }

  .welcome {
    text-align: center;
    padding: 60px 20px;
    color: var(--text-muted);
  }
  .welcome .big-icon { font-size: 48px; margin-bottom: 16px; }
  .welcome h3 { font-size: 22px; font-weight: 800; color: var(--text); margin-bottom: 8px; }
  .welcome p { font-size: 14px; line-height: 1.7; max-width: 400px; margin: 0 auto; }

  .msg {
    display: flex;
    gap: 14px;
    max-width: 800px;
    animation: fadeIn 0.3s ease;
  }
  @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }

  .msg.user { margin-left: auto; flex-direction: row-reverse; }

  .avatar {
    width: 36px; height: 36px; border-radius: 10px;
    display: flex; align-items: center; justify-content: center;
    font-size: 16px; flex-shrink: 0;
  }
  .user .avatar { background: linear-gradient(135deg, var(--accent), var(--accent2)); }
  .assistant .avatar { background: var(--surface2); border: 1px solid var(--border); }

  .bubble {
    padding: 14px 18px;
    border-radius: var(--radius);
    font-size: 14px;
    line-height: 1.75;
    max-width: calc(100% - 50px);
    word-break: break-word;
  }
  .user .bubble {
    background: var(--user-bubble);
    border: 1px solid rgba(124,106,255,0.3);
    border-top-right-radius: 4px;
  }
  .assistant .bubble {
    background: var(--assistant-bubble);
    border: 1px solid var(--border);
    border-top-left-radius: 4px;
  }

  .bubble code {
    font-family: 'JetBrains Mono', monospace;
    background: rgba(255,255,255,0.06);
    padding: 2px 6px;
    border-radius: 4px;
    font-size: 12px;
    color: #a78bfa;
  }

  .bubble pre {
    background: #0d0d18;
    border: 1px solid var(--border);
    border-radius: var(--radius-sm);
    padding: 14px;
    overflow-x: auto;
    margin: 10px 0;
  }
  .bubble pre code {
    background: none; padding: 0;
    font-size: 12px; color: #c4b5fd;
  }

  .cursor {
    display: inline-block;
    width: 2px; height: 16px;
    background: var(--accent);
    border-radius: 1px;
    animation: blink 0.7s steps(1) infinite;
    vertical-align: middle;
    margin-left: 2px;
  }
  @keyframes blink { 0%, 100% { opacity: 1; } 50% { opacity: 0; } }

  /* ── INPUT AREA ── */
  #input-area {
    padding: 20px 24px;
    background: var(--surface);
    border-top: 1px solid var(--border);
  }

  #input-row {
    display: flex;
    gap: 12px;
    align-items: flex-end;
    background: var(--surface2);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 12px 16px;
    transition: border-color 0.2s, box-shadow 0.2s;
  }
  #input-row:focus-within {
    border-color: var(--accent);
    box-shadow: 0 0 0 3px rgba(124,106,255,0.12);
  }

  #user-input {
    flex: 1;
    background: transparent;
    border: none;
    color: var(--text);
    font-family: 'Syne', sans-serif;
    font-size: 14px;
    resize: none;
    outline: none;
    max-height: 180px;
    line-height: 1.6;
    padding: 0;
  }
  #user-input::placeholder { color: var(--text-muted); }

  #send-btn {
    background: linear-gradient(135deg, var(--accent), var(--accent2));
    border: none;
    border-radius: var(--radius-sm);
    color: white;
    cursor: pointer;
    padding: 10px 16px;
    font-size: 18px;
    transition: opacity 0.2s, transform 0.15s;
    flex-shrink: 0;
    display: flex; align-items: center; justify-content: center;
  }
  #send-btn:hover { opacity: 0.9; transform: scale(1.05); }
  #send-btn:disabled { opacity: 0.4; cursor: not-allowed; transform: none; }

  #input-hint {
    font-size: 11px; color: var(--text-muted);
    margin-top: 8px; text-align: center;
  }

  /* ── MOBILE TOGGLE ── */
  #sidebar-toggle {
    display: none;
    background: none; border: none;
    color: var(--text); font-size: 22px; cursor: pointer;
  }

  @media (max-width: 768px) {
    #sidebar {
      position: fixed; left: 0; top: 0; bottom: 0; z-index: 100;
      transform: translateX(-100%);
    }
    #sidebar.open { transform: translateX(0); }
    #sidebar-toggle { display: block; }
    #overlay {
      display: none;
      position: fixed; inset: 0; z-index: 99;
      background: rgba(0,0,0,0.6);
    }
    #overlay.show { display: block; }
  }

  .divider {
    border: none;
    border-top: 1px solid var(--border);
  }

  /* Token counter */
  #token-info {
    font-size: 11px; color: var(--text-muted);
    font-family: 'JetBrains Mono', monospace;
    text-align: right;
  }
</style>
</head>
<body>

<div id="overlay" onclick="closeSidebar()"></div>

<!-- SIDEBAR -->
<aside id="sidebar">
  <div class="sidebar-header">
    <div class="logo-icon">✦</div>
    <span class="logo-text">MyChatGPT</span>
  </div>

  <!-- API KEY -->
  <div class="field-group">
    <div class="section-label">API 設定</div>
    <label>OpenAI API Key</label>
    <div class="api-key-wrapper">
      <input type="password" id="api-key" placeholder="sk-..." autocomplete="off">
      <button class="toggle-key" onclick="toggleKey()" title="顯示/隱藏">👁</button>
    </div>
    <div style="display:flex;align-items:center;margin-top:4px;">
      <span class="status-dot" id="key-dot"></span>
      <span class="status-text" id="key-status">未設定</span>
    </div>
  </div>

  <hr class="divider">

  <!-- MODEL -->
  <div class="field-group">
    <div class="section-label">模型設定</div>
    <label>LLM 模型</label>
    <select id="model-select" onchange="updateModelDisplay()">
      <optgroup label="GPT-4o 系列">
        <option value="gpt-4o">gpt-4o</option>
        <option value="gpt-4o-mini" selected>gpt-4o-mini</option>
        <option value="gpt-4o-2024-11-20">gpt-4o-2024-11-20</option>
      </optgroup>
      <optgroup label="GPT-4 系列">
        <option value="gpt-4-turbo">gpt-4-turbo</option>
        <option value="gpt-4">gpt-4</option>
      </optgroup>
      <optgroup label="GPT-3.5 系列">
        <option value="gpt-3.5-turbo">gpt-3.5-turbo</option>
      </optgroup>
      <optgroup label="o 系列 (Reasoning)">
        <option value="o1-mini">o1-mini</option>
        <option value="o3-mini">o3-mini</option>
      </optgroup>
    </select>
  </div>

  <hr class="divider">

  <!-- SYSTEM PROMPT -->
  <div class="field-group">
    <div class="section-label">System Prompt</div>
    <label>角色設定</label>
    <textarea id="system-prompt" placeholder="你是一個有幫助的 AI 助理...">你是一個有幫助的 AI 助理，請用繁體中文回答，除非使用者要求其他語言。</textarea>
  </div>

  <hr class="divider">

  <!-- API PARAMS -->
  <div class="field-group">
    <div class="section-label">API 參數</div>

    <label>Temperature <span style="font-size:11px;color:var(--text-muted)">(創意度)</span></label>
    <div class="range-row">
      <input type="range" id="temperature" min="0" max="2" step="0.05" value="0.7"
        oninput="document.getElementById('temp-val').textContent=parseFloat(this.value).toFixed(2)">
      <span class="range-val" id="temp-val">0.70</span>
    </div>

    <label style="margin-top:8px">Max Tokens</label>
    <div class="range-row">
      <input type="range" id="max-tokens" min="256" max="4096" step="256" value="2048"
        oninput="document.getElementById('tok-val').textContent=this.value">
      <span class="range-val" id="tok-val">2048</span>
    </div>

    <label style="margin-top:8px">Top P</label>
    <div class="range-row">
      <input type="range" id="top-p" min="0" max="1" step="0.05" value="1"
        oninput="document.getElementById('topp-val').textContent=parseFloat(this.value).toFixed(2)">
      <span class="range-val" id="topp-val">1.00</span>
    </div>

    <label style="margin-top:8px">記憶對話輪數</label>
    <div class="range-row">
      <input type="range" id="memory-turns" min="0" max="20" step="1" value="6"
        oninput="document.getElementById('mem-val').textContent=this.value">
      <span class="range-val" id="mem-val">6</span>
    </div>
  </div>

  <hr class="divider">

  <!-- ACTIONS -->
  <div id="token-info">Token 使用: <span id="token-count">0</span></div>
  <button class="clear-btn" onclick="clearChat()">🗑 清除對話記憶</button>
</aside>

<!-- MAIN -->
<main id="main">
  <header id="chat-header">
    <div style="display:flex;align-items:center;gap:12px;">
      <button id="sidebar-toggle" onclick="openSidebar()">☰</button>
      <h2>對話</h2>
    </div>
    <div id="model-display">gpt-4o-mini</div>
  </header>

  <div id="messages">
    <div class="welcome" id="welcome-msg">
      <div class="big-icon">✦</div>
      <h3>MyChatGPT</h3>
      <p>在左側設定你的 API Key 和模型參數，然後開始對話。支援串流輸出與多輪記憶。</p>
    </div>
  </div>

  <div id="input-area">
    <div id="input-row">
      <textarea id="user-input" rows="1" placeholder="輸入訊息…"
        oninput="autoResize(this)"
        onkeydown="handleKey(event)"></textarea>
      <button id="send-btn" onclick="sendMessage()" title="送出 (Enter)">➤</button>
    </div>
    <div id="input-hint">Enter 送出 ∙ Shift+Enter 換行 ∙ 資料僅存於瀏覽器記憶體</div>
  </div>
</main>

<script>
// ── STATE ──
let conversationHistory = [];
let totalTokens = 0;
let isStreaming = false;

// ── API KEY ──
function toggleKey() {
  const el = document.getElementById('api-key');
  el.type = el.type === 'password' ? 'text' : 'password';
}

document.getElementById('api-key').addEventListener('input', function() {
  const dot = document.getElementById('key-dot');
  const status = document.getElementById('key-status');
  if (this.value.startsWith('sk-') && this.value.length > 20) {
    dot.className = 'status-dot ok';
    status.textContent = '已設定';
  } else if (this.value.length > 0) {
    dot.className = 'status-dot err';
    status.textContent = '格式可能有誤';
  } else {
    dot.className = 'status-dot';
    status.textContent = '未設定';
  }
});

// ── MODEL DISPLAY ──
function updateModelDisplay() {
  document.getElementById('model-display').textContent =
    document.getElementById('model-select').value;
}

// ── TEXTAREA AUTO RESIZE ──
function autoResize(el) {
  el.style.height = 'auto';
  el.style.height = Math.min(el.scrollHeight, 180) + 'px';
}

// ── KEYBOARD ──
function handleKey(e) {
  if (e.key === 'Enter' && !e.shiftKey) {
    e.preventDefault();
    sendMessage();
  }
}

// ── CLEAR ──
function clearChat() {
  conversationHistory = [];
  totalTokens = 0;
  document.getElementById('token-count').textContent = '0';
  const msgs = document.getElementById('messages');
  msgs.innerHTML = `
    <div class="welcome" id="welcome-msg">
      <div class="big-icon">✦</div>
      <h3>MyChatGPT</h3>
      <p>對話已清除。重新開始新的對話吧！</p>
    </div>`;
}

// ── RENDER MESSAGE ──
function addMessage(role, content, streaming = false) {
  const welcome = document.getElementById('welcome-msg');
  if (welcome) welcome.remove();

  const msgs = document.getElementById('messages');
  const div = document.createElement('div');
  div.className = `msg ${role}`;
  div.id = streaming ? 'streaming-msg' : undefined;

  const avatar = document.createElement('div');
  avatar.className = 'avatar';
  avatar.textContent = role === 'user' ? '👤' : '✦';

  const bubble = document.createElement('div');
  bubble.className = 'bubble';

  if (streaming) {
    bubble.innerHTML = '<span class="cursor"></span>';
  } else {
    bubble.innerHTML = formatContent(content);
  }

  div.appendChild(avatar);
  div.appendChild(bubble);
  msgs.appendChild(div);
  msgs.scrollTop = msgs.scrollHeight;
  return { div, bubble };
}

function formatContent(text) {
  // Code blocks
  text = text.replace(/```(\w*)\n?([\s\S]*?)```/g, (_, lang, code) =>
    `<pre><code>${escapeHtml(code.trim())}</code></pre>`);
  // Inline code
  text = text.replace(/`([^`]+)`/g, (_, code) => `<code>${escapeHtml(code)}</code>`);
  // Bold
  text = text.replace(/\*\*(.*?)\*\*/g, '<strong>$1</strong>');
  // Newlines
  text = text.replace(/\n/g, '<br>');
  return text;
}

function escapeHtml(s) {
  return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}

// ── SEND ──
async function sendMessage() {
  if (isStreaming) return;

  const apiKey = document.getElementById('api-key').value.trim();
  if (!apiKey) {
    alert('請先在左側設定 OpenAI API Key！');
    return;
  }

  const input = document.getElementById('user-input');
  const userText = input.value.trim();
  if (!userText) return;

  input.value = '';
  input.style.height = 'auto';
  document.getElementById('send-btn').disabled = true;
  isStreaming = true;

  // Add user message to UI & history
  addMessage('user', userText);
  conversationHistory.push({ role: 'user', content: userText });

  // Trim history to memory window
  const memoryTurns = parseInt(document.getElementById('memory-turns').value);
  const maxMsgs = memoryTurns * 2;
  if (conversationHistory.length > maxMsgs && maxMsgs > 0) {
    conversationHistory = conversationHistory.slice(-maxMsgs);
  }

  // Build messages
  const systemPrompt = document.getElementById('system-prompt').value.trim();
  const messages = [];
  if (systemPrompt) messages.push({ role: 'system', content: systemPrompt });
  messages.push(...conversationHistory);

  // Params
  const model = document.getElementById('model-select').value;
  const temperature = parseFloat(document.getElementById('temperature').value);
  const max_tokens = parseInt(document.getElementById('max-tokens').value);
  const top_p = parseFloat(document.getElementById('top-p').value);

  // Add streaming bubble
  const streamMsg = document.createElement('div');
  streamMsg.className = 'msg assistant';
  const streamAvatar = document.createElement('div');
  streamAvatar.className = 'avatar';
  streamAvatar.textContent = '✦';
  const streamBubble = document.createElement('div');
  streamBubble.className = 'bubble';
  streamBubble.innerHTML = '<span class="cursor"></span>';
  streamMsg.appendChild(streamAvatar);
  streamMsg.appendChild(streamBubble);
  document.getElementById('messages').appendChild(streamMsg);

  let fullText = '';

  try {
    const body = { model, messages, stream: true, max_tokens };
    // o1/o3 don't support temperature / top_p
    if (!model.startsWith('o1') && !model.startsWith('o3')) {
      body.temperature = temperature;
      body.top_p = top_p;
    }

    const resp = await fetch('https://api.openai.com/v1/chat/completions', {
      method: 'POST',
      headers: {
        'Content-Type': 'application/json',
        'Authorization': `Bearer ${apiKey}`
      },
      body: JSON.stringify(body)
    });

    if (!resp.ok) {
      const err = await resp.json();
      throw new Error(err.error?.message || `HTTP ${resp.status}`);
    }

    const reader = resp.body.getReader();
    const decoder = new TextDecoder();

    while (true) {
      const { done, value } = await reader.read();
      if (done) break;
      const chunk = decoder.decode(value, { stream: true });
      const lines = chunk.split('\n');

      for (const line of lines) {
        if (!line.startsWith('data: ')) continue;
        const data = line.slice(6);
        if (data === '[DONE]') break;
        try {
          const parsed = JSON.parse(data);
          const delta = parsed.choices?.[0]?.delta?.content;
          if (delta) {
            fullText += delta;
            streamBubble.innerHTML = formatContent(fullText) + '<span class="cursor"></span>';
            document.getElementById('messages').scrollTop = 999999;
          }
          // Token usage (if returned)
          if (parsed.usage) {
            totalTokens += parsed.usage.total_tokens || 0;
            document.getElementById('token-count').textContent = totalTokens;
          }
        } catch {}
      }
    }

    // Finalize
    streamBubble.innerHTML = formatContent(fullText);
    conversationHistory.push({ role: 'assistant', content: fullText });

  } catch (err) {
    streamBubble.innerHTML = `<span style="color:#f87171">⚠ 錯誤：${err.message}</span>`;
  }

  document.getElementById('send-btn').disabled = false;
  isStreaming = false;
}

// ── MOBILE SIDEBAR ──
function openSidebar() {
  document.getElementById('sidebar').classList.add('open');
  document.getElementById('overlay').classList.add('show');
}
function closeSidebar() {
  document.getElementById('sidebar').classList.remove('open');
  document.getElementById('overlay').classList.remove('show');
}
</script>
</body>
</html>
